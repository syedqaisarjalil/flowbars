name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Lint & type-check (single version — errors don't vary by Python) ──
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install lint tools
        run: pip install ruff mypy numpy pandas pandas-stubs
      - name: Ruff (lint + format check)
        run: |
          ruff check .
          ruff format --check .
      - name: Mypy (strict)
        run: mypy flowbars/

  # ── Tests across supported Python versions ──
  test:
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python 3.9 predates ubuntu-latest (26.04); pin an image that ships it.
          - python-version: "3.9"
            os: ubuntu-22.04
            numba: true
          - python-version: "3.10"
            os: ubuntu-latest
            numba: true
          - python-version: "3.11"
            os: ubuntu-latest
            numba: true
          - python-version: "3.12"
            os: ubuntu-latest
            numba: true
          # numba doesn't support 3.13 yet — skip numba tests there
          - python-version: "3.13"
            os: ubuntu-latest
            numba: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with test deps
        run: |
          pip install -e ".[dev]"
      - name: Install numba (if supported)
        if: matrix.numba
        run: pip install "numba>=0.57"
      - name: Run tests
        run: pytest -v --tb=short
      - name: Check import has no side effects
        run: python -c "import flowbars; print('import ok')"

  # ── Package build check ──
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install build tools
        run: pip install build
      - name: Build package
        run: python -m build
      - name: Check built artifact
        run: |
          ls -la dist/
          SDIST=$(ls dist/flowbars-*.tar.gz)
          python -c "import tarfile, sys; tf = tarfile.open(sys.argv[1]); assert any(n.endswith('/py.typed') for n in tf.getnames()), 'py.typed missing from sdist'; print('py.typed in sdist: OK')" "$SDIST"
